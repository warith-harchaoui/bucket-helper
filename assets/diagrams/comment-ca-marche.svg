<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1393 432" width="1393" height="432" role="img" aria-labelledby="bh-title bh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="bh-title">Comment bucket-helper fonctionne : des identifiants en entrée, des objets dans le stockage que vous avez choisi en sortie</title>
  <desc id="bh-desc">Une plaque de gauche à droite. Entrée : un fichier local ou une clé d'objet, plus des identifiants venant d'un fichier, de l'environnement, ou d'un dictionnaire que vous passez. Le travail, en trois étapes numérotées : le chargeur d'identifiants résout leur provenance puis échoue bruyamment plutôt que de retomber sur un client anonyme ; boto3 ouvre la session vers le point d'accès compatible S3 que vous avez nommé, Amazon S3, MinIO, Backblaze B2, DigitalOcean Spaces, Cloudflare R2 ou Wasabi ; le transfert s'exécute. Sortie : des objets dans le seau que vous avez choisi.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="198" height="78" rx="10"/>
  <text class="n-title" x="127" y="120" text-anchor="middle">un fichier, une clé</text>
  <text class="n-sub" x="127" y="139" text-anchor="middle">plus vos identifiants</text>
  <path class="flow" d="M232 126 H248" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="252" y="54" width="829" height="144" rx="12"/>
  <text class="panel-label" x="272" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="272" y="94" width="276" height="78" rx="10"/>
  <text class="n-title" x="410" y="127" text-anchor="middle">charger les identifiants</text>
  <text class="n-sub" x="410" y="146" text-anchor="middle">fichier, env ou dict — jamais anonyme</text>
  <text class="step" x="283" y="110">1</text>
  <path class="flow" d="M552 133 H568" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="574" y="94" width="205" height="78" rx="10"/>
  <text class="n-title" x="676" y="127" text-anchor="middle">ouvrir la session</text>
  <text class="n-sub" x="676" y="146" text-anchor="middle">boto3, votre point d'accès</text>
  <text class="step" x="585" y="110">2</text>
  <path class="flow" d="M783 133 H799" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="805" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="933" y="127" text-anchor="middle">transférer</text>
  <text class="n-sub" x="933" y="146" text-anchor="middle">envoi, lecture, liste, suppression</text>
  <text class="step" x="816" y="110">3</text>
  <path class="flow" d="M1087 126 H1103" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1107" y="40">SORTIE</text>
  <rect class="io" x="1107" y="87" width="258" height="78" rx="10"/>
  <text class="n-title" x="1236" y="120" text-anchor="middle">des objets dans votre seau</text>
  <text class="n-sub" x="1236" y="139" text-anchor="middle">S3 ou tout stockage compatible</text>
  <rect class="core" x="487" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="697" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="697" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M697 286 V314 H433 V332"/>
  <path class="tie" d="M697 314 H961 V332"/>
  <path class="tie" d="M433 314 V332"/>
  <rect class="surface" x="358" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="433" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M609 314 V332"/>
  <rect class="surface" x="534" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="609" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M785 314 V332"/>
  <rect class="surface" x="710" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="785" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M961 314 V332"/>
  <rect class="surface" x="886" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="961" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="697" y="412" text-anchor="middle">Ce membre est l'exception assumée au local-first de la suite : son métier est de porter vos données vers un stockage que vous avez choisi.</text>
</svg>
