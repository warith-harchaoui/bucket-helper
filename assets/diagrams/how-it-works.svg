<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1267 432" width="1267" height="432" role="img" aria-labelledby="bh-title bh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="bh-title">How bucket-helper works: credentials in, objects in the storage you chose out</title>
  <desc id="bh-desc">A left-to-right plate. In: a local file or an object key, plus credentials from a file, the environment, or a dictionary you pass. The work, in three numbered stages: the credentials loader resolves where they come from and fails loudly rather than falling back to an anonymous client; boto3 opens the session against whichever S3-compatible endpoint you named, Amazon S3, MinIO, Backblaze B2, DigitalOcean Spaces, Cloudflare R2 or Wasabi; and the transfer runs, upload, download, list, delete, exists or presigned URL. Out: objects in the bucket you chose. The caption is the honest exception to the suite's local-first rule.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="171" height="78" rx="10"/>
  <text class="n-title" x="114" y="120" text-anchor="middle">a file, a key</text>
  <text class="n-sub" x="114" y="139" text-anchor="middle">plus your credentials</text>
  <path class="flow" d="M205 126 H221" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="225" y="54" width="764" height="144" rx="12"/>
  <text class="panel-label" x="245" y="76">WHAT IT DOES</text>
  <rect class="stage" x="245" y="94" width="263" height="78" rx="10"/>
  <text class="n-title" x="377" y="127" text-anchor="middle">load credentials</text>
  <text class="n-sub" x="377" y="146" text-anchor="middle">file, env or dict — never anonymous</text>
  <text class="step" x="256" y="110">1</text>
  <path class="flow" d="M512 133 H528" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="534" y="94" width="172" height="78" rx="10"/>
  <text class="n-title" x="620" y="127" text-anchor="middle">open the session</text>
  <text class="n-sub" x="620" y="146" text-anchor="middle">boto3, your endpoint</text>
  <text class="step" x="545" y="110">2</text>
  <path class="flow" d="M710 133 H726" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="732" y="94" width="237" height="78" rx="10"/>
  <text class="n-title" x="851" y="127" text-anchor="middle">transfer</text>
  <text class="n-sub" x="851" y="146" text-anchor="middle">put, get, list, delete, presign</text>
  <text class="step" x="743" y="110">3</text>
  <path class="flow" d="M995 126 H1011" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1015" y="40">OUT</text>
  <rect class="io" x="1015" y="87" width="224" height="78" rx="10"/>
  <text class="n-title" x="1127" y="120" text-anchor="middle">objects in your bucket</text>
  <text class="n-sub" x="1127" y="139" text-anchor="middle">S3 or any compatible store</text>
  <rect class="core" x="418" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="633" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="633" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M633 286 V314 H369 V332"/>
  <path class="tie" d="M633 314 H897 V332"/>
  <path class="tie" d="M369 314 V332"/>
  <rect class="surface" x="294" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="369" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M545 314 V332"/>
  <rect class="surface" x="470" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="545" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M721 314 V332"/>
  <rect class="surface" x="646" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="721" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M897 314 V332"/>
  <rect class="surface" x="822" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="897" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="633" y="412" text-anchor="middle">This member is the honest exception to the suite's local-first rule: its job is to move your data to storage you picked.</text>
</svg>
