[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucket-helper"
version = "1.0.0"
description = "Bucket Helper — utility functions for AWS S3 and any S3-compatible object storage (MinIO, Backblaze B2, DigitalOcean Spaces, Cloudflare R2, Wasabi, etc.) via boto3, exposed as library, argparse CLI, click CLI, and FastAPI HTTP surface. credentials() loader, upload / download / list / delete / exists / make_bucket / remote_tempfile."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["s3", "minio", "boto3", "object-storage", "aws", "r2", "b2", "spaces", "bucket", "cli", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving",
]
dependencies = [
    "os-helper>=2.0.0,<3",
    "boto3>=1.34,<2",
    "botocore>=1.34,<2",
]

[project.optional-dependencies]
# CLI-only-with-click extra. argparse variant needs no runtime dep and
# is always available.
cli = ["click>=8.1,<9"]
# FastAPI HTTP surface (bucket_helper.api). uvicorn + python-multipart
# so multipart file uploads work out of the box.
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
# `dev` keeps the bar low for CI — pytest + moto (in-process S3 mock)
# + pyyaml (config loader) + httpx (FastAPI TestClient) + click
# (so the click CLI import always resolves in tests) + fastapi.
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "moto[s3]>=5",
    "httpx>=0.27",
    "click>=8.1,<9",
    "fastapi>=0.111,<1",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
# argparse-based CLI — no runtime dep beyond stdlib + core package.
bucket-helper = "bucket_helper.cli_argparse:main"
# click-based twin — install with [cli] extra.
bucket-helper-click = "bucket_helper.cli_click:cli"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/bucket-helper"
Issues = "https://github.com/warith-harchaoui/bucket-helper/issues"

[tool.setuptools.packages.find]
include = ["bucket_helper*"]
exclude = ["tests*", "assets*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit a real S3 / MinIO endpoint. Slow and require credentials; skipped by default.",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "tests"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), pycodestyle errors (E), warnings (W),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), simplify (SIM).
# Easy to tighten later; this is the baseline.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line-too-long — handled by formatter / context-dependent
    "B008",  # function call in argument default — too noisy for our style
    "SIM108",  # ternary preferred over if/else — sometimes hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in pytest is fine
